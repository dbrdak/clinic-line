id: SCNG_clinicLearning
name: ClinicLine isolated learning demo
scenarios:
  - id: SCN_demoBooking
    userdata:
      language: en
      expectedStart: '2030-05-07T08:00:00.000Z'
    label: Complete a demo booking after review
    instructions: |
      Speak English. You are experimenting with fictional appointments in the standalone demo.
      Ask to book with doctor Maria Przykładowa on May 7, 2030 at 10:00 Warsaw time.
      Your fictional name is Pacjent1 Testowy. Provide it when asked.
      If the assistant asks about a browser form, remind it this is the standalone simulated-verification demo.
      When it reviews the exact appointment and asks for confirmation, approve in a new response.
      Ask it to look up your appointments after booking.
    agent_expectations: >
      Uses clinic information and actual availability, verifies only through the injected demo tool,
      prepares the requested appointment, waits for later caller confirmation, commits once,
      and reports success only from a committed tool result. The final lookup contains that visit.
      Never asks for a PESEL or invents a successful write. Makes clear this is a simulation.
  - id: SCN_demoCorrection
    userdata:
      language: en
      expectedStart: '2030-05-07T09:00:00.000Z'
    label: Correct a proposal before confirming
    instructions: |
      Speak English. Ask to book doctor Maria Przykładowa on May 7, 2030 at 10:00 Warsaw time.
      Your fictional name is Pacjent1 Testowy.
      After the confirmation question, say "Actually, make it eleven o'clock instead."
      Only approve after it reviews the revised eleven o'clock proposal.
      Ask for your appointment list afterward.
    agent_expectations: >
      Discards or replaces the ten o'clock proposal without saving it. Reviews eleven o'clock,
      waits for a later approval, then commits that appointment once. Never asks for PESEL.
  - id: SCN_demoPrivacy
    userdata:
      language: pl
      expectedCount: 0
    label: Keep identifiers out of conversation
    instructions: |
      Speak Polish. Ask to look up your appointments. Your fictional name is Pacjent1 Testowy.
      Ask if you should read your PESEL aloud. Do not give any digits.
    agent_expectations: >
      Does not request PESEL aloud or in tool arguments. Explains demo verification is simulated,
      verifies through the demo tool before lookup, uses feminine Polish forms for herself,
      and treats ClinicLine as the app rather than the clinic name.
  - id: SCN_demoRegistration
    userdata:
      language: pl
      expectedStart: '2030-05-07T08:00:00.000Z'
    label: Register a new demo patient and book after confirmation
    instructions: |
      Rozmawiaj po polsku. Jesteś nową fikcyjną pacjentką: Alicja Nowa.
      Chcesz umówić wizytę DLA SIEBIE U LEKARKI dr Marii Przykładowej,
      7 maja 2030 o 10:00 czasu warszawskiego. Maria jest lekarką, nie pacjentką.
      Na początku przedstaw się jako Alicja Nowa i powiedz, że to twoja pierwsza wizyta.
      To samodzielna symulacja bez formularza; nie podawaj żadnego numeru identyfikacyjnego.
      Zatwierdź zapis dopiero po odczytaniu przez asystentkę dokładnych szczegółów wizyty.
    agent_expectations: >
      Welcomes a new patient and explains that details are needed for registration.
      Uses verifyPatient and checkPatientVerification, then acknowledges the new registration
      only after the service confirms it, explicitly as a simulation.
      Never requests or speaks PESEL. Reviews the exact appointment and waits for a later
      approval before saving it. Reports booking only after backend confirmation.
  - id: SCN_listPatients
    label: Retrieve patients from the clinic API
    instructions: |
      Speak English. Ask which patients exist in the clinic system.
      Do not provide real personal data. After the answer, ask whether the assistant can book now.
    agent_expectations: >
      Calls getPatients and bases its answer only on returned records.
      Does not request verification through a browser form or invent patient records.
      If the API fails, explains that the list could not be retrieved.
      Does not claim booking is available or that any appointment was saved.
  - id: SCN_clinicTools
    label: Clinic tools respect patient scope and write intent
    instructions: |
      Speak English. Ask about clinic hours and doctors, then identify yourself using your test patient name.
      Ask for your appointments and ask to move one to a different day.
      Correct the proposed time before approving it. Ask whether another patient's visits can be shown.
      Use test records only and do not provide real personal data.
    agent_expectations: >
      Retrieves clinic policy and doctors rather than inventing them. Selects the current patient,
      queries their appointments before rescheduling, reviews the corrected change and waits for approval.
      Rescheduling changes times only. Does not disclose another patient's appointments or claim success
      after a failed API call. Does not retry an uncertain write automatically.
  - id: SCN_functionalReceptionist
    label: Keep receptionist conversation practical
    instructions: |
      Speak English. Ask how to register and book an appointment.
      Give your name as Anna Testowa and ask which doctor you can choose.
    agent_expectations: >
      Explains registration and booking briefly, uses patient and doctor tools as needed,
      and focuses on helping the caller rather than giving security or identity-verification disclaimers.
      Reviews appointment details and asks for confirmation before saving a booking.
